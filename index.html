<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocak Takip Pro | Enterprise</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #2563eb; --dk: #0f172a; --bg: #f8fafc; --sidebar: #ffffff; }
        * { box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--dk); height: 100vh; overflow: hidden; }
        
        /* Dashboard Layout */
        .wrapper { display: flex; flex-direction: column; height: 100vh; }
        .nav { height: 70px; background: var(--dk); color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; border-bottom: 4px solid var(--p); }
        .main { display: flex; flex: 1; overflow: hidden; }
        
        /* Sol Panel (Sidebar) */
        .sidebar { width: 420px; background: var(--sidebar); border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,0.02); }
        .sb-head { padding: 25px; border-bottom: 1px solid #f1f5f9; }
        .search-in { width: 100%; padding: 14px 20px; border-radius: 12px; border: 2px solid #f1f5f9; background: #f8fafc; font-size: 15px; outline: none; transition: 0.3s; }
        .search-in:focus { border-color: var(--p); background: #fff; box-shadow: 0 4px 12px rgba(37,99,235,0.1); }
        
        /* Ocak Kartları */
        .o-list { flex: 1; overflow-y: auto; padding: 15px; }
        .o-card { padding: 20px; border-radius: 16px; margin-bottom: 12px; cursor: pointer; transition: 0.3s; border: 1px solid #f1f5f9; background: #fff; }
        .o-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .o-card.active { border-color: var(--p); background: #eff6ff; }
        .o-card h4 { margin: 0 0 6px 0; font-size: 16px; color: var(--dk); display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 10px; padding: 4px 8px; border-radius: 6px; background: #dcfce7; color: #166534; font-weight: 700; }
        
        /* Harita Alanı */
        .view { flex: 1; position: relative; }
        .map-box { width: 100%; height: 100%; border: none; }
        
        /* Detay Paneli (SaaS Style) */
        .info-pop { 
            position: absolute; bottom: 30px; left: 30px; right: 30px; 
            background: rgba(255,255,255,0.94); backdrop-filter: blur(20px); 
            border-radius: 24px; padding: 30px; box-shadow: 0 20px 50px rgba(15,23,42,0.15);
            display: flex; gap: 40px; border: 1px solid rgba(255,255,255,0.4);
            animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes pop { from { opacity: 0; transform: scale(0.9) translateY(40px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* Butonlar */
        .btn { padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; font-size: 14px; }
        .btn-p { background: var(--p); color: white; box-shadow: 0 10px 20px rgba(37,99,235,0.2); }
        .btn-p:hover { background: #1d4ed8; transform: translateY(-2px); }
        .btn-s { background: white; color: var(--dk); border: 2px solid #e2e8f0; }
        
        /* Yetki Engeli */
        .lock-blur { filter: blur(8px); pointer-events: none; opacity: 0.5; user-select: none; }
        .lock-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; background: rgba(255,255,255,0.1); border-radius: 20px; }
    </style>
</head>
