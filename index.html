<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocak Takip Pro v4.5</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --dark: #202124; --bg: #f8f9fa; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
        .navbar { background: var(--dark); color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 380px; background: white; border-right: 1px solid #dadce0; display: flex; flex-direction: column; }
        .search-box { padding: 15px; border-bottom: 1px solid #eee; }
        .search-box input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .ocak-list { flex: 1; overflow-y: auto; }
        .ocak-item { padding: 15px; border-bottom: 1px solid #f1f3f4; cursor: pointer; transition: 0.2s; }
        .ocak-item:hover { background: #f1f3f4; }
        .ocak-item.active { background: #e8f0fe; border-left: 5px solid var(--primary); }
        .map-view { flex: 1; position: relative; }
        .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid white; color: white; }
        .details-panel { position: absolute; bottom: 20px; left: 20px; right: 20px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; z-index: 10; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [role, setRole] = useState('GUEST'); // GUEST, USER, ADMIN
            const [selected, setSelected] = useState(null);
            const [search, setSearch] = useState('');
            
            // KML'den gelen gerçek veriler
            const [ocaklar, setOcaklar] = useState([
                { id: 1, name: 'ARSİM KALKER OCAĞI', lat: 38.2765, lng: 40.0615, detay: 'Hani Bölgesi - Aktif Ruhsat' },
                { id: 2, name: 'KARAŞİN BAZALT OCAĞI', lat: 38.0523, lng: 40.0758, detay: 'Kocaköy Mevkii - İşletme Safhası' },
                { id: 3, name: 'ÇAYIRLI KALKER OCAĞI', lat: 37.3495, lng: 41.4358, detay: 'Midyat Çevre Yolu Üzeri' },
                { id: 4, name: 'SULAKLI TOPLAMA BAZALT', lat: 37.8179, lng: 40.5219, detay: 'Merkez Sulaklı Köyü' },
                { id: 5, name: 'EMTAŞ K.T. OCAĞI', lat: 37.1433, lng: 41.4450, detay: 'Güneydoğu İşletme Grubu' }
            ]);

            const handleLogin = () => {
                const pass = prompt("Yönetici Şifresi (1234):");
                if (pass === "1234") setRole('ADMIN');
                else if (pass === "user") setRole('USER');
            };

            const filteredOcaklar = ocaklar.filter(o => o.name.toLowerCase().includes(search.toLowerCase()));

            return (
                <div style={{display:'flex', flexDirection:'column', height:'100vh'}}>
                    <div className="navbar">
                        <div style={{display:'flex', alignItems:'center', gap:'10px'}}>
                            <span style={{fontSize:'20px'}}>📍</span>
                            <h2 style={{margin:0, fontSize:'18px'}}>Ocak Takip Navigasyon PRO</h2>
                        </div>
                        <div style={{display:'flex', gap:'10px'}}>
                            {role === 'ADMIN' && <button className="btn btn-outline" onClick={() => alert("Kullanıcı Yönetimi Açıldı")}>Kullanıcılar</button>}
                            {role === 'GUEST' ? 
                                <button className="btn btn-primary" onClick={handleLogin}>Giriş Yap</button> : 
                                <button className="btn btn-outline" onClick={() => setRole('GUEST')}>Çıkış ({role})</button>
                            }
                        </div>
                    </div>

                    <div className="main-container">
                        <div className="sidebar">
                            <div className="search-box">
                                <input 
                                    type="text" 
                                    placeholder="Ocak ismi ile ara..." 
                                    onChange={(e) => setSearch(e.target.value)}
                                />
                            </div>
                            <div className="ocak-list">
                                {filteredOcaklar.map(o => (
                                    <div 
                                        key={o.id} 
                                        className={`ocak-item ${selected?.id === o.id ? 'active' : ''}`}
                                        onClick={() => setSelected(o)}
                                    >
                                        <div style={{fontWeight:'bold', color:'#1a73e8'}}>{o.name}</div>
                                        <div style={{fontSize:'12px', color:'#5f6368', marginTop:'4px'}}>
                                            Mevki: {o.detay.split('-')[0]}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="map-view">
                            <iframe 
                                src={selected ? 
                                    `https://maps.google.com/maps?q=${selected.lat},${selected.lng}&z=15&output=embed` : 
                                    `https://maps.google.com/maps?q=38.4,40.5&z=8&output=embed`}
                                width="100%" height="100%" style={{border:0}} allowFullScreen>
                            </iframe>

                            {selected && (
                                <div className="details-panel">
                                    <div>
                                        <h3 style={{margin:'0 0 5px 0', color:'#202124'}}>{selected.name}</h3>
                                        <p style={{margin:0, fontSize:'14px', color:'#5f6368'}}>{selected.detay}</p>
                                        <p style={{margin:'5px 0 0 0', fontSize:'12px', color:'#1a73e8'}}>Koordinat: {selected.lat}, {selected.lng}</p>
                                    </div>
                                    <div style={{display:'flex', gap:'10px'}}>
                                        <button 
                                            className="btn btn-primary" 
                                            onClick={() => window.open(`https://www.google.com/maps/dir/?api=1&destination=${selected.lat},${selected.lng}`)}
                                        >
                                            Yol Tarifi Al
                                        </button>
                                        {role === 'ADMIN' && <button className="btn" style={{background:'#ea4335', color:'white'}}>Sil</button>}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
